name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - run: go vet ./...
      - run: go test -race ./...

  # A real run: install llama.cpp, pull a small model and chat with it.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Build
        run: go build -o phantom .
      - name: Install llama.cpp (CPU)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./phantom setup --backend cpu
      - name: Pull, chat, list, delete
        run: |
          ./phantom serve > serve.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:11435/api/version && break; sleep 1; done
          ./phantom pull smollm2:135m
          ./phantom list
          reply=$(./phantom run smollm2:135m "Reply with one word: hello")
          echo "Model said: $reply"
          test -n "$reply"
          curl -sf http://127.0.0.1:11435/api/chat -d '{"model":"smollm2:135m","messages":[{"role":"user","content":"Say hi"}],"stream":false}' | tee chat.json
          grep -q '"done":true' chat.json
          curl -sf http://127.0.0.1:11435/v1/chat/completions -d '{"model":"smollm2:135m","messages":[{"role":"user","content":"Say hi"}]}' | grep -q choices
          curl -s --fail-with-body http://127.0.0.1:11435/api/embed -d '{"model":"smollm2:135m","input":["hello","world"]}' | python3 -c "import json,sys; e=json.load(sys.stdin)['embeddings']; assert len(e)==2 and len(e[0])>10, e; print('embeddings OK, dims', len(e[0]))"
          ./phantom ps
          ./phantom rm smollm2:135m
      - name: Server log
        if: always()
        run: cat serve.log || true

  release:
    needs: [test]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Build all platforms
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          [[ "$GITHUB_REF" == refs/tags/v* ]] || VERSION="0.1.${GITHUB_RUN_NUMBER}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir dist
          for target in windows/amd64 windows/arm64 linux/amd64 linux/arm64 darwin/arm64 darwin/amd64; do
            os=${target%/*}; arch=${target#*/}; ext=""; [ "$os" = windows ] && ext=".exe"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X github.com/hamz5ashah/phantom/internal/server.Version=$VERSION" \
              -o "dist/phantom-$os-$arch$ext" .
          done
          (cd dist && sha256sum * > SHA256SUMS.txt)
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=${GITHUB_REF_NAME}
          [[ "$GITHUB_REF" == refs/tags/v* ]] || TAG="build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" dist/* --title "Phantom $VERSION" --target "$GITHUB_SHA" \
            --notes "Download the file for your system, then run \`phantom serve\`. On first start Phantom downloads llama.cpp for your PC."
